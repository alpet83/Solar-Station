; Grid supervisor для LilyGo T-CAN485. Прошивка заливается по OTA поверх BatteryEmulator,
; поэтому схема разделов и платформа должны совпадать с ней (см. README).
[platformio]
default_envs = lilygo_330

[env:lilygo_330]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
lib_extra_dirs = lib
extra_scripts = pre:tools/git_rev.py

; Нативные тесты ядра: `make test` (g++), PlatformIO для них не нужен.
