# UserParameter'ы Zabbix agent2 для контроля скриптов Solar-Station.
#
# Устанавливать в /etc/zabbix/zabbix_agent2.d/solar-station.conf и перезапустить агент:
#   scp etc/zabbix/solar-station.conf root@<host>:/etc/zabbix/zabbix_agent2.d/solar-station.conf
#   systemctl restart zabbix-agent2
#
# Зависимости: jq (для разбора JSON), coreutils (date/stat) — как правило, уже есть в системе.
# Требуется, чтобы /etc/zabbix/zabbix_agent2.conf содержал (обычно включено по умолчанию):
#   Include=/etc/zabbix/zabbix_agent2.d/*.conf

# --- Свежесть данных дамперов ---
#
# Возвращает возраст файла в секундах (now - mtime). Если файла нет — возвращает
# заведомо огромное число (эквивалент отсутствия данных с начала эпохи Unix), чтобы
# триггер "age > N" сработал и в случае пропажи файла, а не только его устаревания.
#
# Пример item: solar.file.age[/tmp/jkbms_last.json]
# Пример триггера: last(/host/solar.file.age[/tmp/jkbms_last.json])>300
#   (дампер jkbms_ctrl.py и pv1800_ctrl.py по умолчанию запускаются по cron раз в 1-5 минут,
#    см. docs/02-installation.md; порог 300с = 5 минут даёт запас на один пропущенный тик)
UserParameter=solar.file.age[*],echo $(( $(date +%s) - $(stat -c %Y "$1" 2>/dev/null || echo 0) ))

# --- Телеметрия BMS для триггеров разряда/баланса ---
#
# Напряжение самой разряженной и самой заряженной ячейки (В), из /tmp/jkbms_last.json
# (структура: {"cells": {"voltages": {"1": 3.403, "2": 3.401, ...}}}, пишется jkbms_ctrl.py).
# При отсутствии файла/некорректном JSON возвращается -1 — заведомо невалидное значение
# для напряжения LiFePO4-ячейки, отличимое от реальных показаний в триггере.
#
# Пример триггера на переразряд (порог ниже cell_UVP из bms_params, см. docs/03-configuration.md):
#   last(/host/solar.bms.cell_min_voltage)>0 and last(/host/solar.bms.cell_min_voltage)<2.8
UserParameter=solar.bms.cell_min_voltage,jq -er '[.cells.voltages[]] | min' /tmp/jkbms_last.json 2>/dev/null || echo -1
UserParameter=solar.bms.cell_max_voltage,jq -er '[.cells.voltages[]] | max' /tmp/jkbms_last.json 2>/dev/null || echo -1

# --- Коды ошибок/предупреждений инвертора ---
#
# pv1800_ctrl.py уже опрашивает эти регистры на каждом цикле и пишет их в
# /tmp/inverter_last.json (см. docs/06-modbus-registers.md, разделы 4-5):
# PV_charger.err_msg/warn_msg (контроллер заряда, регистры 15213/15214) и
# messages.err_1/err_2/err_3/warn_1/warn_2 (сам инвертор, регистры
# 25261-25263, 25265-25266). protocol.xlsx не даёт расшифровку битов внутри
# кодов — коды передаются как есть, "0" по факту означает отсутствие
# ошибки/предупреждения на всех наблюдавшихся значениях. При отсутствии
# файла/невалидном JSON возвращается -1 (вне диапазона реальных 16-битных
# регистров, отличимо от "0 = всё штатно" в триггере).
#
# Пример триггера "есть авария на инверторе или контроллере заряда":
#   last(/host/solar.inv.err_1)>0 or last(/host/solar.inv.err_2)>0 or
#   last(/host/solar.inv.err_3)>0 or last(/host/solar.inv.charger_err_msg)>0
# Аналогично для warn_* - "есть предупреждение".
UserParameter=solar.inv.charger_err_msg,jq -er '.PV_charger.err_msg' /tmp/inverter_last.json 2>/dev/null || echo -1
UserParameter=solar.inv.charger_warn_msg,jq -er '.PV_charger.warn_msg' /tmp/inverter_last.json 2>/dev/null || echo -1
UserParameter=solar.inv.err_1,jq -er '.messages.err_1' /tmp/inverter_last.json 2>/dev/null || echo -1
UserParameter=solar.inv.err_2,jq -er '.messages.err_2' /tmp/inverter_last.json 2>/dev/null || echo -1
UserParameter=solar.inv.err_3,jq -er '.messages.err_3' /tmp/inverter_last.json 2>/dev/null || echo -1
UserParameter=solar.inv.warn_1,jq -er '.messages.warn_1' /tmp/inverter_last.json 2>/dev/null || echo -1
UserParameter=solar.inv.warn_2,jq -er '.messages.warn_2' /tmp/inverter_last.json 2>/dev/null || echo -1

# --- Агрегированные версии для простого триггера ---
#
# Все значения выше числовые (целые из регистров Modbus, не строки), поэтому
# их можно сложить на хосте через jq вместо пяти-элементного OR-условия в
# триггере. Сумма ошибок/предупреждений от разных подсистем теряет
# информацию о том, ЧТО именно сработало (расшифровки битов всё равно нет —
# см. 7.3), но для триггера важен только факт "сумма != 0"; конкретный код
# для диагностики смотрится напрямую в /tmp/inverter_last.json или через
# отдельные *_err_msg/err_1-3 элементы выше (для триггеров использовать эти
# два агрегата, для диагностики при сработавшем алерте - отдельные элементы).
# `// 0` в jq подставляет 0, если поле вдруг отсутствует в JSON (защита от
# неполного цикла записи файла).
#
# Бит 32 (0x20) в PV_charger.err_msg на практике оказался безобидным: он
# выставляется на рассвете/закате, пока панели освещены слабо и контроллер
# заряда некоторое время щёлкает реле PV, пытаясь зацепиться за генерацию -
# это ожидаемое поведение при недостаточной освещённости, а не авария. Бит
# гасится арифметически (jq не умеет в побитовое И) перед суммированием,
# чтобы он не поднимал ложную тревогу дважды в сутки; при этом остальные
# биты charger_err_msg (если появятся одновременно) по-прежнему считаются -
# гасится именно бит 32, а не всё значение целиком.
UserParameter=solar.inv.error,jq -er '(.PV_charger.err_msg // 0) as $c | (if (($c/32|floor) % 2) == 1 then $c - 32 else $c end) + (.messages.err_1 // 0) + (.messages.err_2 // 0) + (.messages.err_3 // 0)' /tmp/inverter_last.json 2>/dev/null || echo -1
UserParameter=solar.inv.warning,jq -er '(.PV_charger.warn_msg // 0) + (.messages.warn_1 // 0) + (.messages.warn_2 // 0)' /tmp/inverter_last.json 2>/dev/null || echo -1
